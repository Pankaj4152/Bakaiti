<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Bakaiti is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #09090b; color: #fafafa; font-family: system-ui, sans-serif; text-align: center; }
      main { display: grid; justify-items: center; gap: 14px; max-width: 320px; }
      .spinner { width: 30px; height: 30px; border: 3px solid #3f3f46; border-top-color: #fafafa; border-radius: 50%; animation: spin .8s linear infinite; }
      h1 { margin: 4px 0 0; font-size: 22px; }
      p { margin: 0; color: #a1a1aa; line-height: 1.5; }
      button { margin-top: 8px; border: 0; border-radius: 10px; padding: 11px 18px; background: #fafafa; color: #09090b; font: inherit; font-weight: 650; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Connection lost</h1>
      <p>Bakaiti could not reach the server. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
